<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת עימוד ספרים תורניים</title>
    <style>
        @font-face {
            font-family: 'Frank-Ruehl';
            src: url('fonts/Frank-Re-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'Frank-Ruehl';
            src: url('fonts/Frank-Re-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'Frank-Ruehl';
            src: url('fonts/Frank-Re-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'Assistant';
            src: url('fonts/Assistant-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'Assistant';
            src: url('fonts/Assistant-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #f5f5f5;
            font-family: 'Frank-Ruehl', 'Assistant', sans-serif;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Frank-Ruehl', 'Assistant', sans-serif;
            font-size: 18px;
            color: #666;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="loading">טוען מערכת עימוד...</div>
    <canvas id="ComposeTarget"></canvas>
    <script src="composeApp.js"></script>
</body>
</html>
